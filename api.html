  <section class="header2">
    <div class="container">

        <div class="col-md-6">
          <img class="img-fluid" src="images/graphics2.png" alt="">

  <section class="form-sec">
    <div class="container mt-5">
    <form class="row g-3" id="submit-form" method="">
      <div class="col-md-6">
        <label for="inputEmail4" class="form-label">Name</label><i class="text-danger">*</i>
        <input type="text" class="form-control" id="name" name="Name" placeholder="Your name" required>
      </div>
      <div class="col-md-6">
        <label for="inputPassword4" class="form-label">Email</label><i class="text-danger">*</i>
        <input type="email" class="form-control" id="email" name="Email" placeholder="example@example.com" required>
      </div>
      <div class="col-md-6">
        <label for="inputEmail4" class="form-label">Website Name</label><i class="text-danger">*</i>
        <input type="text" class="form-control" id="companyName" name="Website Name"  placeholder="Your website name" required>
      </div>
      <div class="col-md-6">
        <label for="inputPassword4" class="form-label">Website Url</label><i class="text-danger">*</i>
        <input type="url" class="form-control" id="companyWebsite" name="Website url"  placeholder="https://sample.com" required>
      </div>
      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="termsAndConditions" name="Terms and conditions" required checked><i class="text-danger">*</i>
          <label class="form-check-label" for="gridCheck">
            Terms and conditions
          </label>
        </div>
      </div>
      <div class="col-12 align-items-center text-center">
        <button type="submit" class="btn-submit2 btn align-items-center">Get API</button>
      </div>
    </form>

  <script src="bootstrap.js"></script>
  <script src="script.js"></script>

  <script>
    $("#submit-form").submit((e)=>{
        e.preventDefault()
        $.ajax({
            url:"https://script.google.com/macros/s/AKfycbwJaZOLpdRrBulc1uh8Pd2ClEM4SggzlQfdwFgpuROpTYlGLd-GmAm-90zuqkeSsDBx/exec",
            data:$("#submit-form").serialize(),
            method:"post",
            success:function (response){
                //alert("Form submitted successfully")
                //window.location.reload()
                window.location.href="request.html"
            },
            error:function (err){
                alert("Something Error")

            }
        })
    })
</script>
