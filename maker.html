  <section class="form-sec">
    <h1 class="text-center">Fill the form</h1>
    <div class="container mt-5">
    <form class="row g-3">
      <div class="col-md-6">
        <label for="inputEmail4" class="form-label">Name</label><i class="text-danger">*</i>
        <input type="text" class="form-control" id="name" name="Name" placeholder="Your name" required>
      </div>
      <div class="col-md-6">
        <label for="inputPassword4" class="form-label">Email</label><i class="text-danger">*</i>
        <input type="email" class="form-control" id="email" name="Email" placeholder="example@example.com" required>
      </div>
      <div class="col-md-6">
        <label for="inputEmail4" class="form-label">Company name</label><i class="text-danger">*</i>
        <input type="text" class="form-control" id="companyName" name="Company Name"  placeholder="Your company name" required>
      </div>
      <div class="col-md-6">
        <label for="inputPassword4" class="form-label">Company website url</label><i class="text-danger">*</i>
        <input type="url" class="form-control" id="companyWebsite" name="Company Website"  placeholder="https://sample.com" required>
      </div>
      <div class="col-md-6">
        <label for="formFile" class="form-label">Select your advertising image <b>(1080 * 1000 px)</b></label><i class="text-danger">*</i>
        <input class="form-control" type="file" name="AD Image" id="adImg" required>
      </div>
      <div class="col-md-6">
        <label for="formFile" class="form-label">Select plan</label><i class="text-danger">*</i>
        <select class="form-select" aria-label="Default select example" name="Plan" required id="plan">
          <option value="" selected>Select plan</option>
          <option value="Free">Free</option>
        </select>
      </div>
      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="termsAndConditions" name="Terms and conditions" required checked><i class="text-danger">*</i>
          <label class="form-check-label" for="gridCheck">
            Terms and conditions
          </label>
        </div>
      </div>
      <div class="col-12 align-items-center text-center">
        <button type="button" class="btn-submit btn align-items-center" onclick="sendMail()">Get reach</button>
      </div>
    </form>
  </div>
