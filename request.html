  <style>
    .code-container {
        width: 100%;
        max-width: 1000px;
        background: rgba(30, 30, 30, 0.9);
        border-radius: 12px;
        padding: 20px;
        position: relative;
        box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.4);
        margin-top: 3em;
        align-items: center;
        text-align: center;
        margin-left: auto;
        margin-right: auto;
        display: block;
    }

    pre {
        margin: 0;
        padding-right: 40px;
        overflow-x: auto;
    }

    .copy-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: rgb(6,28,191);
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-weight: bold;
        transition: background 0.3s ease;
    }

    .copy-btn:hover {
        background: #0056b3;
    }

    .tooltip.show {
        opacity: 1 !important;
    }
</style>
</head>

  <div class="container">

        <pre><code class="language-html">
&lt;script src="https://haseefmuhammed.github.io/adisomapi/adisomapiHaseefSwiftv1r25032025.js"&gt;&lt;/script&gt;

  <script src="bootstrap.js"></script>
  <script src="script.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://haseefmuhammed.github.io/adisomapi/adisomapiHaseefSwiftv1r25032025.js"></script>


  <script>
    // Initialize syntax highlighting
    hljs.highlightAll();

    // Copy to clipboard function
    document.querySelector(".copy-btn").addEventListener("click", function() {
        const code = document.querySelector(".code-container pre code").innerText;
        navigator.clipboard.writeText(code).then(() => {
            const tooltip = new bootstrap.Tooltip(this);
            this.setAttribute("title", "Copied!");
            tooltip.show();
            setTimeout(() => {
                this.setAttribute("title", "Copy to Clipboard");
                tooltip.hide();
            }, 2000);
        });
    });

    // Enable Bootstrap tooltips
    // document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => {
    //     new bootstrap.Tooltip(el);
    // });
</script>
